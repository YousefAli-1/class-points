name: CI

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The Env types include the secrets, which wrangler reads from .dev.vars (not in git).
      - name: Generate Worker types
        run: npx wrangler types --env-file .dev.vars.example
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:all
      - run: npm run build
