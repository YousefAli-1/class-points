name: Deploy

on:
  push:
    branches: [main]
  # Run by hand from the Actions tab. Only a run on main deploys (see the deploy job's `if`).
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys (and their migrations) at once; a newer push waits for the current one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Everything that runs third-party code (npm install scripts, lint, tests, the build) happens here,
  # in a job that has no Cloudflare secrets to steal.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The Env types include the secrets, which wrangler reads from .dev.vars (not in git).
      - name: Generate Worker types
        run: npx wrangler types --env-file .dev.vars.example
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:all
      - run: npm run build

  deploy:
    needs: check
    # Production only ever gets main, even when the workflow is started by hand on another branch:
    # the migrations below can't be undone.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the Cloudflare secrets; DEPLOY.md step 5 limits it to the main branch.
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # No secrets in these steps: they are only given to the two wrangler commands below.
      - run: npm ci
      - name: Generate Worker types
        run: npx wrangler types --env-file .dev.vars.example
      - run: npm run build
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
